<script type="module">
import { auth, db } from "./firebase.js";
import Cache from "./cache.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

import {
  doc,
  getDoc,
  collection,
  query,
  where,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

// ==================================================
// STATE
// ==================================================

let merchantId = "";
let allTransactions = [];
let currentFilter = "ALL";
let currentPage = 1;
const pageSize = 10;

let kenyaTransactions = [];
let globalTransactions = [];
let kenyaReady = false;
let globalReady = false;
let kenyaError = null;
let globalError = null;

let unsubscribeKenya = null;
let unsubscribeGlobal = null;
let loadGeneration = 0;

const $ = id => document.getElementById(id);

// ==================================================
// THEME
// ==================================================

if (localStorage.getItem("theme") === "light") {
  document.body.classList.add("light");
}

// ==================================================
// SAFE HELPERS
// ==================================================

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getDate(value) {
  if (!value) return null;

  if (typeof value.toDate === "function") {
    return value.toDate();
  }

  if (value instanceof Date) {
    return value;
  }

  if (typeof value.seconds === "number") {
    return new Date(value.seconds * 1000);
  }

  const date = new Date(value);

  return Number.isNaN(date.getTime()) ? null : date;
}

function getTime(tx) {
  return getDate(tx.createdAt)?.getTime() || 0;
}

function getReference(tx) {
  return tx.checkoutRequestId ||
    tx.checkout_request_id ||
    tx.reference ||
    tx.id ||
    "--";
}

function getPhone(tx) {
  return tx.phone ||
    tx.phoneNumber ||
    tx.customerPhone ||
    tx.customer_phone ||
    "";
}

function getStatus(tx) {
  const status = String(tx.status || "PENDING")
    .trim()
    .toUpperCase();

  if (["SUCCESS", "COMPLETED"].includes(status)) {
    return "SUCCESS";
  }

  if (["FAILED", "CANCELLED", "REJECTED"].includes(status)) {
    return "FAILED";
  }

  return "PENDING";
}

function getType(tx) {
  const type = String(tx.type || "").toUpperCase();

  if (type === "DEPOSIT") return "Wallet Deposit";
  if (type === "WITHDRAWAL") return "Withdrawal";
  if (type === "REVERSAL") return "Transaction Reversal";

  if (type === "AUTO SERVICE TOP-UP" ||
      type === "AUTO_SERVICE_TOPUP") {
    return "Auto Service Top-up";
  }

  if (tx.balanceType === "wallet") return "Wallet Top-up";
  if (tx.balanceType === "service") return "Service Balance Top-up";

  if (tx.country === "Uganda") {
    return "Uganda · " + (tx.type || "Payment");
  }

  return tx.type || "Transaction";
}

function getIcon(tx) {
  const type = String(tx.type || "").toUpperCase();

  if (type === "DEPOSIT") return "fa-arrow-down";
  if (type === "WITHDRAWAL") return "fa-arrow-up";
  if (type === "REVERSAL") return "fa-rotate-left";

  if (tx.balanceType === "wallet") return "fa-wallet";
  if (tx.balanceType === "service") return "fa-server";

  return "fa-money-check-dollar";
}

function showMessage(title, message) {
  $("transactionList").innerHTML = `
    <div class="empty-state" style="display:block">
      <i class="fas fa-circle-exclamation"></i>
      <h2>${escapeHTML(title)}</h2>
      <p>${escapeHTML(message)}</p>
    </div>
  `;

  $("emptyState").style.display = "none";
  $("pagination").style.display = "none";
}

// ==================================================
// AUTHENTICATION AND MERCHANT
// ==================================================

onAuthStateChanged(auth, async user => {
  const generation = ++loadGeneration;

  stopListeners();

  if (!user) {
    location.href = "login.html";
    return;
  }

  $("transactionList").innerHTML = `
    <div class="empty-state" style="display:block">
      <i class="fas fa-spinner fa-spin"></i>
      <h2>Loading transactions...</h2>
      <p>Please wait.</p>
    </div>
  `;

  $("emptyState").style.display = "none";

  try {
    // Always resolve the current authenticated merchant.
    const userSnap = await getDoc(doc(db, "users", user.uid));

    if (generation !== loadGeneration) return;

    if (!userSnap.exists()) {
      showMessage(
        "Merchant Not Found",
        "Please sign in again or contact BossXpay support."
      );
      return;
    }

    const userData = userSnap.data();

    Cache.set("merchant", userData);
    localStorage.setItem("merchantUid", user.uid);

    merchantId = userData.merchantId || "";

    $("avatar").textContent =
      (userData.fullName || "B").charAt(0).toUpperCase();

    if (!merchantId) {
      showMessage(
        "Merchant ID Missing",
        "Your account has no merchantId. Please contact support."
      );
      return;
    }

    // Do not use the dashboard's four-item cache as full history.
    allTransactions = [];
    renderTransactions();

    listenToTransactions(generation);

  } catch (error) {
    console.error("MERCHANT LOAD ERROR:", error);

    if (generation === loadGeneration) {
      showMessage(
        "Unable to Load Account",
        error.message || "Please refresh and try again."
      );
    }
  }
});

// ==================================================
// REAL-TIME TRANSACTION LISTENERS
// ==================================================

function stopListeners() {
  if (unsubscribeKenya) unsubscribeKenya();
  if (unsubscribeGlobal) unsubscribeGlobal();

  unsubscribeKenya = null;
  unsubscribeGlobal = null;

  kenyaTransactions = [];
  globalTransactions = [];

  kenyaReady = false;
  globalReady = false;

  kenyaError = null;
  globalError = null;
}

function listenToTransactions(generation) {
  const kenyaQuery = query(
    collection(db, "transactions"),
    where("merchantId", "==", merchantId)
  );

  const globalQuery = query(
    collection(db, "globalTransactions"),
    where("merchantId", "==", merchantId)
  );

  unsubscribeKenya = onSnapshot(
    kenyaQuery,
    snapshot => {
      if (generation !== loadGeneration) return;

      kenyaTransactions = snapshot.docs.map(d => ({
        ...d.data(),
        id: d.id,
        _source: "transactions"
      }));

      kenyaReady = true;
      kenyaError = null;
      combineTransactions();
    },
    error => {
      if (generation !== loadGeneration) return;

      console.error("KENYA TRANSACTIONS ERROR:", error);
      kenyaError = error;
      kenyaReady = true;
      combineTransactions();
    }
  );

  unsubscribeGlobal = onSnapshot(
    globalQuery,
    snapshot => {
      if (generation !== loadGeneration) return;

      globalTransactions = snapshot.docs.map(d => ({
        ...d.data(),
        id: d.id,
        _source: "globalTransactions"
      }));

      globalReady = true;
      globalError = null;
      combineTransactions();
    },
    error => {
      if (generation !== loadGeneration) return;

      console.error("GLOBAL TRANSACTIONS ERROR:", error);
      globalError = error;
      globalReady = true;
      combineTransactions();
    }
  );
}

function combineTransactions() {
  if (!kenyaReady || !globalReady) return;

  if (kenyaError && globalError) {
    showMessage(
      "Unable to Load Transactions",
      "Both transaction sources failed. Check your Firestore rules and browser console."
    );
    console.error("Both transaction listeners failed:", {
      kenyaError,
      globalError
    });
    return;
  }

  if (kenyaError || globalError) {
    console.warn(
      "One transaction source is unavailable.",
      { kenyaError, globalError }
    );
  }

  // Use source + document ID to avoid collisions between collections.
  const combined = [
    ...kenyaTransactions,
    ...globalTransactions
  ];

  combined.sort((a, b) => getTime(b) - getTime(a));

  allTransactions = combined;
  currentPage = 1;

  renderTransactions();
}

// ==================================================
// SEARCH AND FILTERS
// ==================================================

$("searchInput").addEventListener("input", () => {
  currentPage = 1;
  renderTransactions();
});

document.querySelectorAll(".filter-btn[data-filter]")
  .forEach(button => {
    button.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn[data-filter]")
        .forEach(b => b.classList.remove("active"));

      button.classList.add("active");
      currentFilter = button.dataset.filter;
      currentPage = 1;

      renderTransactions();
    });
  });

function getFilteredTransactions() {
  const search = $("searchInput").value.trim().toLowerCase();

  return allTransactions.filter(tx => {
    const reference = String(getReference(tx)).toLowerCase();
    const phone = String(getPhone(tx)).toLowerCase();
    const status = getStatus(tx);

    const matchesSearch =
      reference.includes(search) || phone.includes(search);

    const matchesStatus =
      currentFilter === "ALL" || status === currentFilter;

    return matchesSearch && matchesStatus;
  }).sort((a, b) => getTime(b) - getTime(a));
}

// ==================================================
// SUMMARY AND TRANSACTION RENDERING
// ==================================================

function renderTransactions() {
  const list = $("transactionList");
  const empty = $("emptyState");

  // Summary counts reflect all loaded records, not just the current page.
  let success = 0;
  let pending = 0;
  let failed = 0;

  allTransactions.forEach(tx => {
    const status = getStatus(tx);

    if (status === "SUCCESS") success++;
    else if (status === "FAILED") failed++;
    else pending++;
  });

  $("totalTransactions").textContent =
    allTransactions.length.toLocaleString();

  $("successTransactions").textContent = success.toLocaleString();
  $("pendingTransactions").textContent = pending.toLocaleString();
  $("failedTransactions").textContent = failed.toLocaleString();

  const filtered = getFilteredTransactions();

  if (!filtered.length) {
    list.innerHTML = "";
    empty.style.display = "block";
    $("pagination").style.display = "none";
    return;
  }

  empty.style.display = "none";
  $("pagination").style.display = "flex";

  const totalPages = Math.max(
    1,
    Math.ceil(filtered.length / pageSize)
  );

  currentPage = Math.min(currentPage, totalPages);

  const start = (currentPage - 1) * pageSize;
  const pageTransactions = filtered.slice(start, start + pageSize);

  $("pageInfo").textContent =
    `Page ${currentPage} of ${totalPages}`;

  $("prevPage").disabled = currentPage === 1;
  $("nextPage").disabled = currentPage === totalPages;

  $("prevPage").style.opacity =
    currentPage === 1 ? ".5" : "1";

  $("nextPage").style.opacity =
    currentPage === totalPages ? ".5" : "1";

  list.innerHTML = pageTransactions.map(tx => {
    const status = getStatus(tx);
    const css = status.toLowerCase();
    const date = getDate(tx.createdAt);

    const formattedDate = date
      ? date.toLocaleString()
      : "--";

    const amount = Number(tx.amount || 0);
    const safeAmount = Number.isFinite(amount) ? amount : 0;

    return `
      <div class="transaction-card"
           data-id="${escapeHTML(tx.id)}"
           data-source="${escapeHTML(tx._source)}">

        <div class="transaction-top">
          <div style="min-width:0">
            <div class="reference">
              <i class="fas ${getIcon(tx)}"
                 style="color:#2563eb;margin-right:8px"></i>
              ${escapeHTML(getType(tx))}
            </div>

            <div class="transaction-info">
              ${escapeHTML(getPhone(tx) || "--")}
            </div>

            <div class="transaction-info">
              ${escapeHTML(getReference(tx))}
            </div>

            <div class="transaction-info">
              ${escapeHTML(tx.country || "Kenya")}
            </div>
          </div>

          <div class="amount">
            ${escapeHTML(tx.currency || "KES")}
            ${Math.abs(safeAmount).toLocaleString()}
          </div>
        </div>

        <div class="transaction-info">
          <span>${escapeHTML(formattedDate)}</span>
          <span class="status ${css}">
            ${escapeHTML(status)}
          </span>
        </div>
      </div>
    `;
  }).join("");

  list.querySelectorAll(".transaction-card").forEach(card => {
    card.addEventListener("click", () => {
      showDetails(card.dataset.id, card.dataset.source);
    });
  });
}

// ==================================================
// PAGINATION
// ==================================================

$("prevPage").addEventListener("click", () => {
  if (currentPage > 1) {
    currentPage--;
    renderTransactions();
  }
});

$("nextPage").addEventListener("click", () => {
  const totalPages = Math.ceil(
    getFilteredTransactions().length / pageSize
  );

  if (currentPage < totalPages) {
    currentPage++;
    renderTransactions();
  }
});

// ==================================================
// TRANSACTION DETAILS
// ==================================================

function showDetails(id, source) {
  const tx = allTransactions.find(item =>
    item.id === id && item._source === source
  );

  if (!tx) return;

  const amount = Number(tx.amount || 0);
  const status = getStatus(tx);
  const date = getDate(tx.createdAt);

  const rows = [
    ["Transaction Type", getType(tx)],
    ["Reference", getReference(tx)],
    ["Phone", getPhone(tx) || "--"],
    [
      "Amount",
      `${tx.currency || "KES"} ${
        Number.isFinite(amount) ? amount.toLocaleString() : "0"
      }`
    ],
    ["Status", status],
    ["Country", tx.country || "Kenya"],
    ["Gateway", "BossXpay"],
    ["Date", date ? date.toLocaleString() : "--"],
    ["Merchant Request", tx.merchantRequestId || "--"]
  ];

  if (tx.fee != null) {
    rows.push([
      "Fee",
      `${tx.currency || "KES"} ${Number(tx.fee || 0).toLocaleString()}`
    ]);
  }

  if (tx.payoutAmount != null) {
    rows.push([
      "Net Amount",
      `${tx.currency || "KES"} ${
        Number(tx.payoutAmount || 0).toLocaleString()
      }`
    ]);
  }

  if (tx.description) {
    rows.push(["Description", tx.description]);
  }

  $("detailsContent").innerHTML = rows.map(([label, value]) => `
    <div class="detail-row">
      <span>${escapeHTML(label)}</span>
      <strong style="overflow-wrap:anywhere;text-align:right">
        ${escapeHTML(value)}
      </strong>
    </div>
  `).join("") + `
    <button class="copy-btn" id="copyReferenceBtn">
      Copy Reference
    </button>
  `;

  $("copyReferenceBtn").addEventListener("click", async () => {
    const reference = String(getReference(tx));

    try {
      await navigator.clipboard.writeText(reference);
      alert("Reference copied.");
    } catch (error) {
      window.prompt("Copy this reference:", reference);
    }
  });

  $("detailsModal").style.display = "flex";
}

// ==================================================
// CLOSE MODAL AND BACK BUTTON
// ==================================================

$("closeModal").addEventListener("click", () => {
  $("detailsModal").style.display = "none";
});

$("detailsModal").addEventListener("click", event => {
  if (event.target === $("detailsModal")) {
    $("detailsModal").style.display = "none";
  }
});

$("backBtn").addEventListener("click", () => {
  location.href = "dashboard.html";
});
</script>
  
</body>
